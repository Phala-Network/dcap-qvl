[toolchain]
# The NEAR gas-test stack (near-sdk 5, near-sandbox 0.3.x, near-vm-runner
# 0.34.x) predates nearcore 2.12, so its sandbox cannot run wasm with
# bulk-memory opcodes (memory.fill/copy): the contract fails with
# PrepareError(Deserialization) even though cargo-near's wasm-opt accepts it.
# Those opcodes come from the precompiled compiler-builtins rustlib (rustc
# >= 1.86 enables bulk memory by default), which RUSTFLAGS cannot override —
# so pin the build below that threshold. Keep in sync with
# [package.metadata.near.reproducible_build] above.
channel = "1.85.0"
components = ["rustfmt", "clippy"]
targets = ["wasm32-unknown-unknown"]
