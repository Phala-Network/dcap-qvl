# Plumber configuration: the built-in defaults plus what this repository needs.
extends: plumber:default
version: "2.0"

github:
  controls:
    githubActionMustComeFromAuthorizedSources:
      includePlumberDefaults: true
      # Third-party actions the workflows use, on top of the default trust list.
      trustedGithubActions:
        - Swatinem/rust-cache
        - nttld/setup-ndk
        - reactivecircus/android-emulator-runner
