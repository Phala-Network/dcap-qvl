# Plumber configuration: the built-in defaults plus what this repository needs.
extends: plumber:default
version: "2.0"

github:
  controls:
    githubActionMustComeFromAuthorizedSources:
      includePlumberDefaults: true
      # Third-party actions the workflows use, on top of the default trust list.
      trustedGithubActions:
        - actions-rust-lang/setup-rust-toolchain
        - Swatinem/rust-cache # called by setup-rust-toolchain
        - dtolnay/rust-toolchain
        - nttld/setup-ndk
        - reactivecircus/android-emulator-runner
    # setup-rust-toolchain and dtolnay/rust-toolchain download the rustup
    # installer only when rustup is missing, and the GitHub-hosted runners
    # these jobs use come with it.
    actionsMustNotExecuteMutableRemoteCode:
      enabled: false
    # master has no branch protection rule today, a repository setting no pull
    # request can change. Remove this block once it has one.
    branchMustBeProtected:
      enabled: false
