name: Plumber

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  plumber:
    name: Check the workflows with Plumber
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # workflow states and one run log, to prove each job's token scope
      security-events: write # list the findings under code scanning

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run Plumber
        uses: getplumber/plumber@v0.7.23
        with:
          # Pull requests from forks get a read-only token, so the code
          # scanning upload is skipped there. The report stays a workflow
          # artifact.
          upload-sarif: ${{ github.event.pull_request.head.repo.fork != true }}
          # Fail under 85 points. The default gate is 100, where any finding
          # fails.
          min-points: 85
