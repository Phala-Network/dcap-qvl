name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.3.1)"
        required: true
        type: string
      prerelease:
        description: "Is this a prerelease?"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create
    outputs:
      tag: ${{ steps.get-version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Get version
        id: get-version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          # Simple changelog generation - you can enhance this
          if git tag --list | grep -q "v"; then
            PREVIOUS_TAG=$(git tag --list "v*" --sort=-version:refname | head -n2 | tail -n1)
            if [[ -n "$PREVIOUS_TAG" ]]; then
              CHANGELOG=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s" --no-merges)
            else
              CHANGELOG=$(git log --pretty=format:"- %s" --no-merges)
            fi
          else
            CHANGELOG=$(git log --pretty=format:"- %s" --no-merges)
          fi

          # Save changelog to file
          cat > changelog.md << EOF
          ## Changes in ${{ steps.get-version.outputs.tag }}

          ${CHANGELOG}

          ## Python Package

          This release includes Python wheels for multiple platforms:
          - Linux: x86_64, x86, aarch64, armv7, s390x, ppc64le
          - Windows: x64, x86
          - macOS: x86_64, aarch64 (Apple Silicon)

          Install with: \`pip install dcap-qvl==${{ steps.get-version.outputs.version }}\`

          ## Rust Crate

          Add to your \`Cargo.toml\`:
          \`\`\`toml
          dcap-qvl = "${{ steps.get-version.outputs.version }}"
          \`\`\`
          EOF

      # gh calls the same Create a release endpoint as the archived
      # actions/create-release did. --target only applies when the tag does
      # not exist yet (a manual run), as the action's commitish default did.
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.get-version.outputs.tag }}
          PRERELEASE: ${{ github.event.inputs.prerelease || false }}
        run: |
          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" --title "Release $TAG" --notes-file changelog.md --target "$GITHUB_SHA" "${flags[@]}"

  build-rust:
    name: Build Rust Binaries
    needs: create-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # gh release upload
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact-name: dcap-qvl-linux-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact-name: dcap-qvl-linux-x86_64-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact-name: dcap-qvl-windows-x86_64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact-name: dcap-qvl-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact-name: dcap-qvl-macos-aarch64

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - name: Build CLI
        run: |
          cd cli
          cargo build --release --target ${{ matrix.target }}

      # gh names the asset after the file, so the binary is copied to the
      # asset name first.
      - name: Upload CLI Binary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
          BINARY: cli/target/${{ matrix.target }}/release/dcap-qvl${{ contains(matrix.target, 'windows') && '.exe' || '' }}
          ASSET: ${{ matrix.artifact-name }}
        run: |
          cp "$BINARY" "$ASSET"
          gh release upload "$TAG" "$ASSET"

  publish-crates:
    name: Publish to crates.io
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish dcap-qvl crate
        run: cargo publish --token ${{ secrets.CRATES_IO_TOKEN }}
        continue-on-error: true # Don't fail if already published

      - name: Publish dcap-qvl-cli crate
        run: |
          cd cli
          cargo publish --token ${{ secrets.CRATES_IO_TOKEN }}
        continue-on-error: true # Don't fail if already published
